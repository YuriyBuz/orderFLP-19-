    <script>
    /**
     * Преобразует разные форматы ссылок GitHub (полные, частичные, относительные)
     * в один, правильный и полностью закодированный URL-адрес для изображения.
     */
    function formatGitHubImageUrl(url) {
        if (!url || typeof url !== 'string') return '';
        let finalUrl = url;

        if (!url.startsWith('http')) {
            const imagesMarker = 'images/';
            const pathStartIndex = url.indexOf(imagesMarker);
            if (pathStartIndex !== -1) {
                const cleanedPath = url.substring(pathStartIndex);
                finalUrl = 'https://raw.githubusercontent.com/YuriyBuz/orderFLP-13-/main/' + cleanedPath;
            } else {
                return ''; 
            }
        }
        else if (url.startsWith('https://github.com/')) {
            finalUrl = url.replace('https://github.com/', 'https://raw.githubusercontent.com/').replace('/blob/', '/');
        }

        const mainMarker = '/main/';
        const mainIndex = finalUrl.indexOf(mainMarker);

        if (mainIndex === -1) return finalUrl;

        const baseUrl = finalUrl.substring(0, mainIndex + mainMarker.length);
        const pathPart = finalUrl.substring(mainIndex + mainMarker.length);

        const encodedPath = pathPart.split('/')
            .map(segment => {
                try { return decodeURIComponent(segment); } 
                catch (e) { return segment; }
            })
            .map(segment => encodeURIComponent(segment))
            .join('/');

        return baseUrl + encodedPath;
    }
    </script>

    <script>
    // --- Configuration ---
    // ID вашої Google Таблиці з посилання: https://docs.google.com/spreadsheets/d/1JH8p91B-kykGNcJcr4PzHDP8i_rFPQNZFIr2jDbdTwc/...
    const GOOGLE_SHEET_ID = '1JH8p91B-kykGNcJcr4PzHDP8i_rFPQNZFIr2jDbdTwc';
    const GID = '0'; // ID конкретного листа (з кінця вашого посилання)
    
    // Формуємо URL для завантаження таблиці у форматі Excel (xlsx) напряму від Google
    const GOOGLE_SHEETS_EXPORT_URL = `https://docs.google.com/spreadsheets/d/${GOOGLE_SHEET_ID}/export?format=xlsx&gid=${GID}`;
    

    // === НАЛАШТУВАННЯ ВІДПРАВКИ ЗАМОВЛЕННЯ (Apps Script) =====================
    // 1) Розгорніть Code.gs як Web App і вставте сюди URL, що закінчується на /exec
    const BACKEND_URL    = 'https://script.google.com/macros/s/AKfycbxzDduDw5opW-UqzbvN3K_N3cQLnsD1SMeCGOcVNvp6GqOH80H25jZNuSXJaXnvD30hrA/exec';
    // 2) Мітка прайсу — потрапляє в лист і в колонку "Прайс" таблиці
    const APP_TAG        = 'FLP-19';
    // 3) Має ТОЧНО збігатися з CONFIG.SECRET у Code.gs
    const SHARED_SECRET  = 'FLP-2026-Kyiv-7x';
    const PENDING_KEY    = 'flpPendingOrders';
    // =========================================================================

    let productGroups = [];
    let flatProducts = [];
    let order = {};
    let customerInfo = {};
    
    const el = (selector) => document.querySelector(selector);

    function renderProducts() {
        const productList = el('#product-list');
        el('#loading-indicator')?.remove();

        if (productGroups.length === 0) {
            productList.innerHTML = `<div class="text-center py-10 text-gray-500"><p>Не вдалося завантажити товари. Перевірте посилання на таблицю або чи відкритий до неї доступ.</p></div>`;
            return;
        }

        productList.innerHTML = productGroups.map(group => {
            if (!group.products || group.products.length === 0) return '';
            
            const productItemsHTML = group.products.map(p => {
                const itemOrder = order[p.sku] || { quantity: 0, unit: 'box' };
                const quantityValue = itemOrder.quantity > 0 ? itemOrder.quantity : '';
                const totalPcs = itemOrder.quantity * p.perBox;
                const subtotal = itemOrder.quantity * p.price * p.perBox;
                
                return `
                <div class="bg-white border border-gray-200 rounded-xl shadow-md hover:shadow-lg transition-shadow p-4 grid grid-cols-1 md:grid-cols-12 gap-x-4 gap-y-3 items-center product-item cursor-pointer" data-sku="${p.sku}" data-name="${p.name.toLowerCase()}" data-image-url="${p.imageUrl || ''}">
                    <!-- Product Info (Col 1-8) -->
                    <div class="col-span-1 md:col-span-8 flex flex-col sm:flex-row sm:items-center space-x-3">
                        <img src="${p.imageUrl}" alt="${p.name}" class="w-12 h-12 object-contain rounded-lg shadow-inner mr-2 sm:mr-0" onerror="this.onerror=null;this.src='https://placehold.co/48x48/A7F3D0/000?text=ITEM';">
                        <div>
                            <p class="font-bold text-lg text-gray-800">${p.name}</p>
                            <p class="text-sm text-gray-600 space-x-2">
                                <span class="font-mono">Арт: ${p.sku}</span>
                                <span>|</span>
                                <span>В ящ: <span class="font-medium text-blue-800">${p.perBox} шт</span></span>
                            </p>
                        </div>
                    </div>
                    
                    <!-- Order Input & Subtotal (Col 9-12) -->
                    <div class="col-span-1 md:col-span-4 flex items-center justify-between">
                        <div class="flex items-center space-x-2">
                            <input type="number" class="quantity-input w-20 md:w-20 p-2 border border-blue-400 rounded-lg text-center font-semibold text-2xl md:text-lg focus:border-orange-500 focus:ring-1 focus:ring-orange-500" placeholder="0" min="0" value="${quantityValue}" data-sku="${p.sku}">
                            <span class="text-base text-gray-600">ящ.</span>
                            <div class="flex flex-col items-center ml-2">
                                <span class="text-xs text-gray-500">Кількість</span>
                                <span class="font-medium total-pcs-display text-sm text-blue-700">${totalPcs} шт</span>
                            </div>
                        </div>
                        <div class="flex flex-col items-end">
                            <span class="text-xl md:text-sm font-semibold text-gray-700">Ціна: ${p.price.toFixed(2)} грн</span>
                            <div class="text-right text-3xl md:text-2xl font-bold text-blue-600 subtotal">
                                ${subtotal.toFixed(2)}
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('');

            return `
            <div class="product-group">
                <h2 class="text-xl font-extrabold mb-3 text-gray-700 sticky top-24 md:top-28 p-3 bg-gray-100/90 border-b-2 backdrop-blur-sm rounded-lg z-10 shadow-sm transition-all duration-300" style="border-color: #6ab04c;">${group.groupName}</h2>
                <div class="space-y-3">
                    ${productItemsHTML}
                </div>
            </div>
            `;
        }).join('');

        updateGrandTotal();
        el('#order-details-section').classList.remove('hidden');
        el('#footer-bar').classList.remove('translate-y-full');
    }
    
    // --- Core Loading Function ---
    async function loadProductsFromGoogleSheet() {
        // Додаємо timestamp щоб запобігти кешуванню браузером
        const response = await fetch(`${GOOGLE_SHEETS_EXPORT_URL}&t=${new Date().getTime()}`);
        if (!response.ok) throw new Error(`Помилка мережі: ${response.status} ${response.statusText}`);
        
        const arrayBuffer = await response.arrayBuffer();
        const data = new Uint8Array(arrayBuffer);
        const workbook = XLSX.read(data, { type: 'array' });
        const firstSheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[firstSheetName];
        
        const json = XLSX.utils.sheet_to_json(worksheet, { header: 1 }); 
        
        let currentGroup = null;
        productGroups = [];

        json.forEach((row) => {
            if (!row || row.length === 0) return;

            // Зчитуємо колонки A та B для визначення типу рядка
            const colA = String(row[0] || '').trim();
            const colB = String(row[1] || '').trim();

            // Ігноруємо шапку таблиці
            if (colA === 'Артикул' || colA === '') return;

            // Якщо є колонка A, але немає колонки B — це заголовок групи
            if (colA && !colB) {
                currentGroup = { groupName: colA, products: [] };
                productGroups.push(currentGroup);
            } 
            // Якщо є і Артикул (A) і Найменування (B) — це товар
            else if (colA && colB) {
                const product = {
                    sku: colA,                                                  // Колоннка A (індекс 0)
                    name: colB,                                                 // Колонка B (індекс 1)
                    perBox: parseInt(row[2], 10) || 1,                          // Колонка C (індекс 2)
                    imageUrl: formatGitHubImageUrl(String(row[3] || '')),       // Колонка D (індекс 3) - URL Зображення
                    price: parseFloat(String(row[5] || '0').replace(',', '.')) || 0.00 // Колонка F (індекс 5) - Ціна
                };

                if (!currentGroup) {
                    currentGroup = { groupName: 'Інші товари', products: [] };
                    productGroups.push(currentGroup);
                }
                currentGroup.products.push(product);
            }
        });

        flatProducts = productGroups.flatMap(group => group.products);
    }

    function updateGrandTotal() {
        const total = flatProducts.reduce((acc, p) => {
            const itemOrder = order[p.sku] || { quantity: 0 };
            return acc + (itemOrder.quantity * p.price * p.perBox);
        }, 0);
        el('#grand-total').textContent = `${total.toFixed(2)} грн`;
    }
    
    function handleQuantityChange(e) {
        const target = e.target;
        if (!target.classList.contains('quantity-input')) return;
        
        const sku = target.dataset.sku;
        let value = parseInt(target.value, 10) || 0;
        if (value < 0) value = 0;
        
        target.value = value > 0 ? value : ''; 

        order[sku] = { quantity: value, unit: 'box' };
        const product = flatProducts.find(p => p.sku === sku);
        if (product) {
            const parent = target.closest('.product-item');
            parent.querySelector('.total-pcs-display').textContent = `${(value * product.perBox)} шт`;
            parent.querySelector('.subtotal').textContent = (value * product.price * product.perBox).toFixed(2);
        }
        updateGrandTotal();
        saveStateToLocalStorage();
    }

    function handleCustomerInfoChange(e) {
         const keyMap = { 'delivery-address': 'address', 'contact-person': 'contact', 'order-comment': 'comment' };
         const id = e.target.id;
         customerInfo[keyMap[id]] = e.target.value;
         saveStateToLocalStorage();
    }

    function saveStateToLocalStorage() {
        try {
            const cleanedOrder = Object.fromEntries(
                Object.entries(order).filter(([sku, details]) => details.quantity > 0)
            );
            localStorage.setItem('orderAppState', JSON.stringify({ order: cleanedOrder, customerInfo }));
        } catch (error) {
             console.error("Error saving state to localStorage:", error);
        }
    }

    function loadStateFromLocalStorage() {
        try {
            const stateJSON = localStorage.getItem('orderAppState');
            if (!stateJSON) return;

            const state = JSON.parse(stateJSON);
            if (state) {
                order = state.order || {};
                customerInfo = state.customerInfo || {};
                el('#delivery-address').value = customerInfo.address || '';
                el('#contact-person').value = customerInfo.contact || '';
                el('#order-comment').value = customerInfo.comment || '';
            }
        } catch (error) {
            console.error("Could not load state from localStorage:", error);
            localStorage.removeItem('orderAppState');
            order = {};
            customerInfo = {};
        }
    }
    
    function getActiveOrderItems() {
        return Object.entries(order).map(([sku, details]) => {
            const product = flatProducts.find(p => p.sku === sku);
            if (!product || !details || details.quantity <= 0) return null;
            const totalQuantity = details.quantity * product.perBox;
            return {
                sku: product.sku, name: product.name, price: product.price,
                quantity: details.quantity, unit: 'box', total_pcs: totalQuantity,
                subtotal: totalQuantity * product.price
            };
        }).filter(Boolean);
    }
    
    function resetOrder() {
        if (!confirm("Ви впевнені, що хочете скасувати все замовлення?")) return;
        
        order = {};
        customerInfo = {};
        el('#delivery-address').value = '';
        el('#contact-person').value = '';
        el('#order-comment').value = '';
        saveStateToLocalStorage();
        renderProducts();
        showToast('Замовлення скасовано!', 'success');
    }

    // ---- Відправка замовлення на сервер (пошта + Google Таблиця) ----

    function buildOrderText(items) {
        const grandTotal = items.reduce((acc, item) => acc + item.subtotal, 0);
        return `*НОВЕ ЗАМОВЛЕННЯ*\n\n` +
               `*Адреса:* ${customerInfo.address}\n` +
               `*Контакт:* ${customerInfo.contact}\n` +
               (customerInfo.comment ? `*Коментар:* ${customerInfo.comment}\n` : '') +
               `--------------------\n` +
               items.map(item => `• ${item.name} (ціна: ${item.price.toFixed(2)} грн) - ${item.quantity} ящ. (${item.total_pcs} шт.)`).join('\n') +
               `\n--------------------\n` +
               `*Всього до сплати: ${grandTotal.toFixed(2)} грн*`;
    }

    function newClientOrderId() {
        if (window.crypto && crypto.randomUUID) return crypto.randomUUID();
        return 'id-' + Date.now() + '-' + Math.random().toString(16).slice(2);
    }

    function buildOrderPayload(items) {
        const sum = items.reduce((a, i) => a + i.subtotal, 0);
        return {
            secret: SHARED_SECRET,
            app: APP_TAG,
            clientOrderId: newClientOrderId(),
            createdAt: new Date().toISOString(),
            customer: {
                address: customerInfo.address || '',
                contact: customerInfo.contact || '',
                comment: customerInfo.comment || ''
            },
            items: items,
            totals: {
                positions: items.length,
                boxes: items.reduce((a, i) => a + i.quantity, 0),
                pcs:   items.reduce((a, i) => a + i.total_pcs, 0),
                sum:   Math.round(sum * 100) / 100
            },
            userAgent: navigator.userAgent
        };
    }

    async function postOrder(payload) {
        if (!BACKEND_URL || BACKEND_URL.indexOf('PASTE_WEB_APP_URL') === 0) {
            throw new Error('BACKEND_URL не налаштовано');
        }
        // text/plain робить запит "простим": браузер не шле preflight OPTIONS,
        // який Apps Script не обробляє. mode:'no-cors' НЕ використовуємо —
        // інакше відповідь недоступна і помилки стають невидимими.
        const res = await fetch(BACKEND_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(payload),
            redirect: 'follow'
        });
        if (!res.ok) throw new Error('HTTP ' + res.status);
        const data = await res.json();
        if (!data || data.ok !== true) throw new Error((data && data.error) || 'Сервер відхилив замовлення');
        return data;
    }

    function queuePendingOrder(payload) {
        try {
            const q = JSON.parse(localStorage.getItem(PENDING_KEY) || '[]');
            q.push(payload);
            localStorage.setItem(PENDING_KEY, JSON.stringify(q.slice(-20)));
        } catch (e) { console.error('Не вдалося зберегти замовлення в чергу:', e); }
    }

    async function flushPendingOrders() {
        let q = [];
        try { q = JSON.parse(localStorage.getItem(PENDING_KEY) || '[]'); } catch (e) { return; }
        if (!q.length) return;
        const rest = [];
        for (const p of q) {
            try { await postOrder(p); } catch (e) { rest.push(p); }
        }
        localStorage.setItem(PENDING_KEY, JSON.stringify(rest));
        const sent = q.length - rest.length;
        if (sent > 0) showToast(`Надіслано відкладених замовлень: ${sent}`, 'success');
    }

    function clearOrderAfterSend() {
        order = {};
        customerInfo.comment = '';
        el('#order-comment').value = '';
        saveStateToLocalStorage();
        renderProducts();
    }

    let isSending = false;

    /**
     * Одна кнопка — три дії:
     *   1) тиха відправка на Apps Script (пошта + Google Таблиця)
     *   2) копіювання тексту в буфер обміну
     *   3) відкриття системного вікна "Поділитися"
     *
     * ПОРЯДОК КРИТИЧНИЙ. navigator.share() і копіювання працюють лише поки живий
     * "жест користувача". Будь-який await ДО них — і Safari/Chrome кинуть
     * NotAllowedError. Тому fetch стартуємо, але НЕ чекаємо: результат
     * обробляємо через .then/.catch уже після відкриття "Поділитися".
     */
    async function submitOrder() {
        if (isSending) return;

        const activeOrderItems = getActiveOrderItems();
        if (activeOrderItems.length === 0) return showToast('Замовлення порожнє, нічого надсилати.', 'error');

        customerInfo.address = el('#delivery-address').value.trim();
        customerInfo.contact = el('#contact-person').value.trim();
        customerInfo.comment = el('#order-comment').value.trim();

        if (!customerInfo.address || !customerInfo.contact) {
            return showToast('Будь ласка, заповніть адресу та контактну особу.', 'error');
        }
        saveStateToLocalStorage();

        const orderText = buildOrderText(activeOrderItems);
        const payload   = buildOrderPayload(activeOrderItems);

        const btn = el('#share-order');
        const btnHTML = btn.innerHTML;
        isSending = true;
        btn.disabled = true;
        btn.classList.add('opacity-60', 'cursor-not-allowed');

        // --- 1. Стартуємо відправку (без await!) ---
        postOrder(payload)
            .then(res => {
                showToast(`Замовлення ${res.orderNo || ''} прийнято · текст скопійовано`, 'success');
                clearOrderAfterSend();
            })
            .catch(err => {
                console.error('Не вдалося надіслати замовлення:', err);
                queuePendingOrder(payload);
                showToast('Немає зв’язку. Замовлення збережено і надішлеться автоматично.', 'error');
            })
            .finally(() => {
                isSending = false;
                btn.disabled = false;
                btn.classList.remove('opacity-60', 'cursor-not-allowed');
                btn.innerHTML = btnHTML;
            });

        // --- 2. Копіюємо в буфер (синхронно, поки жест ще "живий") ---
        copyToClipboard(orderText, true);

        // --- 3. Відкриваємо "Поділитися" ---
        if (canUseNativeShare(orderText)) {
            try {
                await navigator.share({ title: 'Замовлення Food Line Production', text: orderText });
            } catch (error) {
                // AbortError = користувач закрив вікно. Це не помилка: замовлення вже пішло.
                if (error && error.name !== 'AbortError') {
                    console.error('Web Share не спрацював, показуємо запасне вікно:', error);
                    openShareFallback(orderText);
                }
            }
        } else {
            openShareFallback(orderText);
        }
    }

    /**
     * Chrome і Edge на десктопі МАЮТЬ navigator.share, але системне вікно там
     * регулярно падає з "Не удалось показать все способы, которыми можно поделиться".
     * Тому нативний share вмикаємо лише на сенсорних пристроях, а на десктопі
     * показуємо власне вікно з готовими посиланнями.
     */
    function canUseNativeShare(text) {
        if (!navigator.share) return false;

        const isTouch    = window.matchMedia && window.matchMedia('(pointer: coarse)').matches;
        const isMobileUA = /Android|iPhone|iPad|iPod|Mobile|Silk/i.test(navigator.userAgent);
        if (!isTouch && !isMobileUA) return false;

        if (navigator.canShare) {
            try { return navigator.canShare({ text: text }); } catch (e) { return false; }
        }
        return true;
    }

    function openShareFallback(text) {
        const enc = encodeURIComponent(text);
        el('#share-fallback-text').value = text;
        el('#share-telegram').href = 'https://t.me/share/url?url=' + encodeURIComponent(location.href) + '&text=' + enc;
        el('#share-viber').href    = 'viber://forward?text=' + enc;
        el('#share-email').href    = 'mailto:?subject=' + encodeURIComponent('Замовлення Food Line Production') + '&body=' + enc;
        el('#share-fallback').classList.remove('hidden');
    }

    function closeShareFallback() {
        el('#share-fallback').classList.add('hidden');
    }

    function copyToClipboard(text, silent) {
        let ok = false;
        // execCommand синхронний — не "з'їдає" жест користувача перед navigator.share()
        try {
            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.opacity = '0';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();
            ok = document.execCommand('copy');
            document.body.removeChild(textArea);
        } catch (err) {
            ok = false;
        }
        // запасний варіант для браузерів, де execCommand вимкнено
        if (!ok && navigator.clipboard) {
            navigator.clipboard.writeText(text)
                .then(() => { ok = true; })
                .catch(e => console.error('Буфер обміну недоступний:', e));
        }
        if (!silent) {
            showToast(ok ? 'Текст замовлення скопійовано!' : 'Не вдалося скопіювати текст.',
                      ok ? 'success' : 'error');
        }
    }

    function filterProducts() {
        const searchTerm = el('#search-input').value.toLowerCase();
        const clearBtn = el('#search-clear-btn');
        
        clearBtn.classList.toggle('hidden', searchTerm.length === 0);

        document.querySelectorAll('.product-group').forEach(groupEl => {
            let visibleProductsInGroup = 0;
            groupEl.querySelectorAll('.product-item').forEach(item => {
                const name = item.dataset.name || '';
                const isVisible = name.includes(searchTerm);
                item.classList.toggle('hidden', !isVisible);
                if (isVisible) {
                    visibleProductsInGroup++;
                }
            });
            groupEl.classList.toggle('hidden', visibleProductsInGroup === 0 && searchTerm.length > 0);
        });
    }

    function setupEventListeners() {
        el('#product-list').addEventListener('input', handleQuantityChange);

        el('#product-list').addEventListener('click', (e) => {
            const item = e.target.closest('.product-item');
            if (item && !e.target.closest('input')) {
                const product = flatProducts.find(p => p.sku === item.dataset.sku);
                if (!product) return;
                
                const imageUrl = item.dataset.imageUrl || `https://placehold.co/600x400/60A5FA/FFF?text=${encodeURIComponent(product.name)}`;

                el('#modal-img').src = imageUrl;
                el('#modal-caption').textContent = product.name;
                el('#image-modal').classList.remove('hidden');
            }
        });

        el('#close-modal').addEventListener('click', () => el('#image-modal').classList.add('hidden'));
        el('#image-modal').addEventListener('click', (e) => {
            if(e.target === el('#image-modal')) el('#image-modal').classList.add('hidden');
        });

        ['delivery-address', 'contact-person', 'order-comment'].forEach(id => {
            el(`#${id}`).addEventListener('input', handleCustomerInfoChange);
        });
        
        el('#share-order').addEventListener('click', submitOrder);

        el('#share-fallback-close').addEventListener('click', closeShareFallback);
        el('#share-fallback').addEventListener('click', (e) => {
            if (e.target === el('#share-fallback')) closeShareFallback();
        });
        el('#share-copy-again').addEventListener('click', () => {
            copyToClipboard(el('#share-fallback-text').value, false);
        });

        el('#reset-order').addEventListener('click', resetOrder);

        el('#search-input').addEventListener('input', filterProducts);
        el('#search-clear-btn').addEventListener('click', () => {
            el('#search-input').value = '';
            filterProducts();
            el('#search-input').focus();
        });
    }
    
    let toastTimeout;
    function showToast(message, type = 'success') {
        clearTimeout(toastTimeout);
        const toast = el('#toast');
        toast.textContent = message;
        
        const baseClasses = 'fixed top-5 right-5 text-white py-3 px-6 rounded-xl shadow-xl transition-all duration-300 z-50 font-medium';
        const colorClass = type === 'success' ? 'bg-green-600' : 'bg-red-600';
        
        toast.className = `${baseClasses} ${colorClass} opacity-0 transform translate-y-10`;
        
        void toast.offsetWidth; 
        
        toast.style.opacity = '1';
        toast.style.transform = 'translateY(0)';
        
        toastTimeout = setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateY(2.5rem)';
        }, 3000);
    }

    async function main() {
        const loadingIndicator = el('#loading-indicator p');
        
        function updateStatus(message) {
            if (loadingIndicator) loadingIndicator.textContent = message;
            console.log(message);
        }

        try {
            updateStatus('Налаштування інтерфейсу...');
            el('#current-date').textContent = new Date().toLocaleDateString('uk-UA', { weekday: 'short', year: 'numeric', month: 'long', day: 'numeric' });
            loadStateFromLocalStorage();
            setupEventListeners();
            
            const headerContainer = el('#header-container');
            let lastScrollTop = 0;
            window.addEventListener('scroll', () => {
                let scrollTop = window.pageYOffset || document.documentElement.scrollTop;
                if (scrollTop > lastScrollTop && scrollTop > headerContainer.offsetHeight) {
                    headerContainer.classList.add('-translate-y-full');
                    document.querySelectorAll('.product-group h2').forEach(h2 => {
                        h2.style.top = '0px';
                    });
                } else {
                    headerContainer.classList.remove('-translate-y-full');
                    document.querySelectorAll('.product-group h2').forEach(h2 => {
                        h2.style.top = ''; 
                    });
                }
                lastScrollTop = scrollTop <= 0 ? 0 : scrollTop;
            }, { passive: true });

            updateStatus('Завантаження товарів з Google Таблиці...');
            await loadProductsFromGoogleSheet();
            
            updateStatus('Відображення товарів...');
            renderProducts();

            // тихо дошлемо все, що не пішло минулого разу
            flushPendingOrders();

        } catch (error) {
            console.error("CRITICAL ERROR during app initialization:", error);
            if (loadingIndicator) {
                 loadingIndicator.parentElement.innerHTML = `<p class="text-red-600 font-semibold">Сталася критична помилка завантаження даних</p><p class="text-xs text-gray-500 mt-1">${error.message}. Перевірте чи відкритий доступ до Google Таблиці за посиланням.</p>`;
            }
        }
    }

    document.addEventListener('DOMContentLoaded', main);
    </script>
